[project]
name = "getbody-dimos"
version = "0.1.0"
description = "List any DimOS robot on GetBody so AI agents can lease it. Maps its MCP skills to GetBody commands, with lease-scoped permissions and a hard kill. Unofficial."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
dependencies = [
    "cryptography>=42",
    "httpx>=0.27",
    "pyyaml>=6",
    "websockets>=12",
]

[project.optional-dependencies]
# Optional halt check: read odometry straight off the dimos bus. Same versions dimos pins.
# dimos-lcm brings lcm-dimos-fork (the `lcm` module); it has no Windows wheels.
odom-zenoh = ["dimos-lcm>=0.1.4", "eclipse-zenoh>=1.10.1,<2"]
odom-lcm = ["dimos-lcm>=0.1.4"]

[project.scripts]
getbody-dimos = "getbody_dimos.cli:main"

# `dimos run getbody-dimos.unitree-go2-mcp` once this package is installed next to dimos.
# Only dimos ever imports this module; the bridge itself never imports dimos.
[project.entry-points."dimos.blueprints"]
unitree-go2-mcp = "getbody_dimos.blueprints.unitree_go2:unitree_go2_mcp"

[dependency-groups]
dev = ["mypy>=1.11", "pytest>=8", "ruff>=0.6", "types-pyyaml>=6"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/getbody_dimos"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 125
target-version = "py310"
extend-exclude = ["src/getbody_dimos/vendor", "dimos"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
files = ["src/getbody_dimos"]
exclude = ['src/getbody_dimos/vendor/getbody_bridge\.py$', 'src/getbody_dimos/blueprints/']
strict = true
warn_unreachable = true

# The vendored GetBody bridge is typed by vendor/getbody_bridge.pyi.
# dimos, zenoh, lcm and dimos-lcm are optional and untyped.
[[tool.mypy.overrides]]
module = ["zenoh", "lcm", "dimos_lcm.*", "dimos.*", "langchain_core.*"]
ignore_missing_imports = true
follow_imports = "skip"
